name: Build and Test

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_FILE: "TQVaultAE.slnx"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build Release
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Publish release outputs
        run: pwsh -File .github/scripts/Publish-Release.ps1 -OutputDir publish

      - name: Upload TQVaultAE-GUI-Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TQVaultAE-GUI-Release
          path: publish/TQVaultAE/
          retention-days: 3

      - name: Upload ARZExplorer-Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARZExplorer-Release
          path: publish/ARZExplorer/
          retention-days: 3

      - name: Upload TQ-SaveFilesExplorer-Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TQ-SaveFilesExplorer-Release
          path: publish/TQSaveFilesExplorer/
          retention-days: 3

      - name: Upload tqdb-win-x64-Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqdb-win-x64-Release
          path: publish/tqdb-win-x64/
          retention-days: 3

      - name: Upload tqdb-linux-x64-Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqdb-linux-x64-Release
          path: publish/tqdb-linux-x64/
          retention-days: 3

  test:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build test project
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --solution ${{ env.SOLUTION_FILE }} --configuration Release --no-build --report-xunit-trx

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 3

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always()
        with:
          files: "**/TestResults/*.trx"
