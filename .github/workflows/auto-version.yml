name: Auto Version and Release

on:
  push:
    branches: [master]
    paths:
      - 'version-info.json'

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_FILE: "TQVaultAE.slnx"

jobs:
  version-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VERSION_BUMP_TOKEN }}

      - name: Sync version to all projects
        run: pwsh -File .github/scripts/Update-Version.ps1 -VersionType "Sync"

      - name: Commit version sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync version from version-info.json [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build Release
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Publish release outputs
        run: pwsh -File .github/scripts/Publish-Release.ps1 -OutputDir publish

      - name: Read version for tag
        id: version-tag
        shell: pwsh
        run: |
          $versionInfo = Get-Content version-info.json | ConvertFrom-Json
          $tagName = "$($versionInfo.Major).$($versionInfo.Minor).$($versionInfo.Build)"
          "version=$tagName" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $tagName"

      - name: Create version tag
        run: |
          git tag ${{ steps.version-tag.outputs.version }}
          git push origin ${{ steps.version-tag.outputs.version }}

      - name: Create release archives
        shell: pwsh
        run: |
          $version = "${{ steps.version-tag.outputs.version }}"
          
          # Windows applications: self-contained win-x64
          Compress-Archive -Path "publish/TQVaultAE/*" -DestinationPath "TQVaultAE.GUI-$version.zip" -Force
          Compress-Archive -Path "publish/TQSaveFilesExplorer/*" -DestinationPath "TQSaveFilesExplorer-$version.zip" -Force
          Compress-Archive -Path "publish/ARZExplorer/*" -DestinationPath "ARZExplorer-$version.zip" -Force

          # tqdb: self-contained single file, for Windows and Linux
          Compress-Archive -Path "publish/tqdb-win-x64/*" -DestinationPath "tqdb-win-x64-$version.zip" -Force
          Compress-Archive -Path "publish/tqdb-linux-x64/*" -DestinationPath "tqdb-linux-x64-$version.zip" -Force
          
          Write-Host "Created release archives:"
          Get-ChildItem *.zip

      - name: Upload TQVaultAE-GUI-Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TQVaultAE-GUI-Release
          path: publish/TQVaultAE/
          retention-days: 3

      - name: Upload ARZExplorer-Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARZExplorer-Release
          path: publish/ARZExplorer/
          retention-days: 3

      - name: Upload TQ-SaveFilesExplorer-Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TQ-SaveFilesExplorer-Release
          path: publish/TQSaveFilesExplorer/
          retention-days: 3

      - name: Upload tqdb-win-x64-Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqdb-win-x64-Release
          path: publish/tqdb-win-x64/
          retention-days: 3

      - name: Upload tqdb-linux-x64-Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tqdb-linux-x64-Release
          path: publish/tqdb-linux-x64/
          retention-days: 3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version-tag.outputs.version }}
          files: |
            TQVaultAE.GUI-*.zip
            TQSaveFilesExplorer-*.zip
            ARZExplorer-*.zip
            tqdb-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
